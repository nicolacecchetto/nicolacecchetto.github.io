<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synesthesia Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.8.3/src/md5.min.js"></script>
    <style>

        * {
            padding: 0;
            margin: 0;
        }

        body {
            height: 100vh;
            width: 100vw;

            background-color: #121216;
            color: #e1e1e1;
            font-family: "Roboto", sans-serif;
            font-weight: 400;
            font-style: normal;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: "Iceland", sans-serif;
            font-weight: 400;
            font-style: normal;
            margin-top: 2rem;
            font-size: 4rem;
        }

        #text-input {
            margin: 1rem;
            width: 300px;
        }

        #container {
            height: 50%;
            width: 50%;
            min-height: 300px;
            min-width: 300px;
            border: 2px solid #e1e1e1;
            border-radius: 20px;
        }

        #info {
            display: flex;
            align-items: center;
        }

        #color1-block, #color2-block {
            height: 20px;
            width: 20px;
            margin-left: 1rem;
            margin-right: 0.25rem;
        }

        #arrow {
            font-size: 3rem;
            height: 80px;
            display: none;
        }

        p {
            margin: 0;
        }

        #arrow-text {
            margin-left: 1rem;
        }

    </style>

    <script>

        async function getColorName(rgb) {
            try {
                const response = await fetch(`https://www.thecolorapi.com/id?rgb=${rgb}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch color name');
                }
                const data = await response.json();
                return data.name.value;
            } catch (error) {
                console.error(error);
                return 'Unknown Color';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            let debounceTimer; // Timer for debouncing

            document.getElementById('text-input').addEventListener('input', function(event) {

                // Clear the previous debounce timer
                clearTimeout(debounceTimer);

                // Set a new debounce timer
                debounceTimer = setTimeout(async function() {
                    const container = document.getElementById('container');
                    const arrow = document.getElementById('arrow');
                    const arrowtext = document.getElementById('arrow-text');
                    const color1text = document.getElementById('color1-text');
                    const color2text = document.getElementById('color2-text');
                    const color1block = document.getElementById('color1-block');
                    const color2block = document.getElementById('color2-block');
                    const string = event.target.value;

                    const hash = md5(string);

                    const n1 = parseInt(hash.slice(0,3), 16) % 360;
                    const n2 = parseInt(hash.slice(3,6), 16) % 256;
                    const n3 = parseInt(hash.slice(6,9), 16) % 256;
                    const n4 = parseInt(hash.slice(9,12), 16) % 256;
                    const n5 = parseInt(hash.slice(12,15), 16) % 256;
                    const n6 = parseInt(hash.slice(15,18), 16) % 256;
                    const n7 = parseInt(hash.slice(18,21), 16) % 256;

                    const deg = `${n1}deg`;
                    const color1 = `rgb(${n2},${n3},${n4})`;
                    const color2 = `rgb(${n5},${n6},${n7})`;

                    const colorName1 = await getColorName(color1);
                    const colorName2 = await getColorName(color2);

                    container.style.background = `linear-gradient(${deg}, ${color1}, ${color2})`;
                    arrow.style.transform = `rotate(${deg})`;
                    arrow.style.display = "block";
                    arrowtext.innerText = deg;
                    color1text.innerText = colorName1;
                    color1block.style.backgroundColor = color1;
                    color2text.innerText = colorName2;
                    color2block.style.backgroundColor = color2;
                }, 1000); // 1-second delay
            });
        });

    </script>
</head>
<body>
    <h1>Synesthesia Generator</h1>
    <input type="text" class="form-control" id="text-input" placeholder="write something"/>
    <div id="container"></div>
    <div id="info">
        <span id="arrow">&#8593;</span>
        <p id="arrow-text"></p>
        <span id="color1-block"></span>
        <p id="color1-text"></p>
        <span id="color2-block"></span>
        <p id="color2-text"></p>
    </div>
</body>
</html>
